; per-version php.ini override — edit disable_functions here, then
; `docker restart phtest-VERSION` to apply
;
; "strict hosting" profile — mirrors common shared-hosting hardening
; (cPanel/CloudLinux-style disable_functions presets):
;   shell execution:  exec,shell_exec,system,passthru,popen,proc_open,
;                      proc_close,proc_get_status,proc_nice,proc_terminate
;   process control:  pcntl_exec,pcntl_fork,pcntl_signal,pcntl_wait,
;                      pcntl_waitpid,posix_kill,posix_mkfifo,posix_setuid,
;                      posix_setgid,posix_seteuid,posix_setegid,
;                      posix_setsid,posix_setpgid
;   env/runtime:       putenv,dl,ini_alter,ini_restore
;   filesystem escape: symlink,link
;   network/remote dl: fsockopen,pfsockopen,stream_socket_client,
;                      stream_socket_server,curl_exec,curl_multi_exec,
;                      curl_init  (see allow_url_fopen/allow_url_include
;                      below for the stream-wrapper side of "remote dl")
;   apache escape:     apache_child_terminate,apache_setenv
;   recon/disclosure:  show_source,highlight_file,posix_uname
;   log tampering:     syslog,openlog,closelog
disable_functions = exec,shell_exec,system,passthru,popen,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_wait,pcntl_waitpid,posix_kill,posix_mkfifo,posix_setuid,posix_setgid,posix_seteuid,posix_setegid,posix_setsid,posix_setpgid,putenv,dl,ini_alter,ini_restore,symlink,link,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,curl_exec,curl_multi_exec,curl_init,apache_child_terminate,apache_setenv,show_source,highlight_file,posix_uname,syslog,openlog,closelog

; remote-download lockdown — blocks fopen()/file_get_contents()/file()/
; include() from reaching http(s):// URLs, independent of disable_functions
allow_url_fopen = Off
allow_url_include = Off

; hide "X-Powered-By: PHP/x.y.z" — cheap recon-surface reduction
expose_php = Off

display_errors = On
